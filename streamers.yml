# GTA 6 clipper — creator list
# enabled: true  -> the scheduled workflow checks this creator every 30 min
# permission: the clipping program that allows you to post their clips ("none" = no permission, keep disabled)
# sponsored: true -> description gets a "tick Paid promotion" reminder (set true if a brand/creator pays you per view)
# hashtags: required hashtags from that program (CHECK the program brief and edit these)
defaults:
  hashtags: ["#GTA6", "#GTAVI", "#Shorts"]

creators:
  - id: kaicenat
    name: Kai Cenat
    short: Kai
    platform: twitch
    channel: kaicenat
    permission: "Content Rewards"
    sponsored: false
    enabled: false
    hashtags: ["#KaiCenat"]

  - id: ishowspeed
    name: IShowSpeed
    short: Speed
    platform: youtube
    channel: "@IShowSpeed"
    permission: "check-campaign"      # Reach / Expedia campaign only — confirm you are accepted before posting
    program: "Reach (Expedia campaign)"
    sponsored: true
    enabled: false
    hashtags: ["#IShowSpeed", "#Speed"]

